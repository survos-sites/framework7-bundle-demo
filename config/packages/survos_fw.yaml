# Default configuration for extension with alias: "survos_fw"
survos_fw:
  theme: fw7
  enabled: true
  name: Voxitour
  projects:

    # Prototype
#    omar:
#      code: omar
#      logo: logo/omar.png
#      name: OmarExpo

    chijal: # previously pgsc
      code: chijal
      logo: /logos/chijal-logo.jpg
      name: Chijal
      tabs:
        - locations
        - map
        - artists
        - obras
        - info
      #          - share
      #          - scan
      database: chijal
      # Served by wp-chijal's Symfony kernel (/sf/api), reading the Grist document through
      # survos/grist-bundle's API Platform provider. It replaces two predecessors: the old
      # chijal.org/api, which published every venue including the 28 that are closed along
      # with contact emails and phone numbers, and the WordPress REST proxy that fixed those
      # with a hand-maintained field allow-list.
      #
      # Local while it settles. Production is https://wp-chijal.survos.com/sf/api, and the
      # env vars are already set there -- the code is simply not deployed yet.
      stores:
        - name: artists
          schema: code
          url: https://wp-chijal.wip/sf/api/artists
#          url: https://chijal.org/api/artists
        - name: locations
          schema: code
          url: https://wp-chijal.wip/sf/api/locations
#          url: https://chijal.org/api/locations
        - name: obras
          # location.id indexes nothing and did not on the old endpoint either -- it emitted
          # a nested location with @id and code, never a plain id. Left as it was rather than
          # quietly changed: whether the app wants that index is its own question.
          schema: code,artistCode,locationCode,location.id
          url: https://wp-chijal.wip/sf/api/obras
#          url: https://chijal.org/api/obras
        - name: checkins
          schema: locationCode,timestamp
          url: null
        - name: claps
          schema: obraCode,clapsCount
          url: null

    modo: # configuration code for database, etc.
      code: modo
      logo: /logos/modo_logo.webp
      name: El Modo
      tabs:
        - expos
        - info
        # - share
        # if data is set, composer req survos/js-twig-bundle
        #      data: # must be json-ld

        # indexDb database name
      database: Modo
      stores:
        - name: expos
          schema: code
          url: https://modo.survos.com/api/{locale}/expos
        - name: objects
          schema: ++id
          url: https://modo.survos.com/api/{locale}/objs

      members:
        # Prototype
        - email: tacman@gmail.com
          role: PROJECT_ADMIN

    cmas: # configuration code for database, etc.
      code: cmas
      name: CMAS
      tabs:
        - sacros
        - info
      database: cmas
      stores:
        - name: sacros
          schema: code
          url: https://chijal.org/api/sacros
